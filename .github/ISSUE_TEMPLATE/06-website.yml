name: Website content
description: Report a problem or propose a change to the site
title: "[Website content] "
labels: ["website", "needs-review"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What are you proposing?
      description: A short description of the addition or change.
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Relevant link
      description: >-
        A DOI, repository, or page URL, whichever applies. Leave blank if none.

  - type: textarea
    id: rationale
    attributes:
      label: Why does this belong on the portal?
      description: >-
        What it gives the community, and how it relates to what is already
        there.
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I checked that this is not already on the site
          required: true
